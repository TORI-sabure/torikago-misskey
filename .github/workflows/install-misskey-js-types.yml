name: Install generated Misskey JS types
on:
  push:
    branches: [fix/recommended-timeline-ci]
    paths: [.github/workflows/install-misskey-js-types.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: fix/recommended-timeline-ci }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .config/example.yml .config/default.yml
      - run: pnpm build
      - run: pnpm --filter backend generate-api-json
      - run: cp packages/backend/built/api.json packages/misskey-js/generator/api.json
      - run: pnpm run --filter misskey-js-type-generator generate
      - run: cp packages/misskey-js/generator/built/autogen/* packages/misskey-js/src/autogen/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f packages/misskey-js/src/autogen packages/misskey-js/generator/api.json
          git rm .github/workflows/install-misskey-js-types.yml
          git commit -m "chore: install generated Misskey JS API types"
          git push origin HEAD:fix/recommended-timeline-ci
