name: Regenerate Misskey JS

on:
  push:
    branches:
      - fix/recommended-timeline-ci
    paths:
      - .github/workflows/regenerate-misskey-js.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recommended-timeline-ci
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .config/example.yml .config/default.yml
      - run: pnpm build
      - run: pnpm --filter backend generate-api-json
      - run: cp packages/backend/built/api.json packages/misskey-js/generator/api.json
      - run: pnpm run --filter misskey-js-type-generator generate
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/misskey-js
          git rm .github/workflows/regenerate-misskey-js.yml
          git commit -m "chore: regenerate Misskey JS API types"
          git push origin HEAD:fix/recommended-timeline-ci
